# Skill source manifest
#
# Each entry maps a local skill directory to its upstream source repository.
# The weekly sync script (scripts/sync-skills.py) reads this file, fetches each
# upstream, and opens a PR with the proposed updates.
#
# Schema:
#   path:           local skill directory, relative to repo root
#   local:          true = no upstream, never synced (custom or local-only skill)
#   repo:           upstream git URL (https://github.com/<owner>/<name>)
#   upstream_path:  path within the upstream repo (defaults to `path`)
#   ref:            upstream git ref to track (defaults to `main`)
#   license:        SPDX license identifier of the upstream skill
#   notes:          free-form notes shown in the PR description

sources:

